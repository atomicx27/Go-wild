<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Agentic Swarm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #050505;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
        }
        .neon-border {
            border: 1px solid #00ffcc;
            box-shadow: 0 0 10px #00ffcc, inset 0 0 10px #00ffcc;
        }
        .neon-text {
            text-shadow: 0 0 5px #00ffcc, 0 0 10px #00ffcc;
        }
        .log-container {
            background-color: #001111;
            border: 1px solid #005555;
            height: 60vh;
            overflow-y: auto;
            padding: 1rem;
            white-space: pre-wrap;
            box-shadow: inset 0 0 15px rgba(0, 255, 204, 0.2);
        }
        .log-line {
            margin-bottom: 0.5rem;
            opacity: 0.9;
        }
        .log-line.system { color: #ff00ff; text-shadow: 0 0 5px #ff00ff; }
        .log-line.action { color: #ffff00; text-shadow: 0 0 5px #ffff00; }
        .log-line.error { color: #ff0000; text-shadow: 0 0 5px #ff0000; }
        .log-line.success { color: #00ff00; text-shadow: 0 0 5px #00ff00; }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #001111; }
        ::-webkit-scrollbar-thumb { background: #005555; }
        ::-webkit-scrollbar-thumb:hover { background: #00ffcc; }
    </style>
</head>
<body class="min-h-screen p-8 flex flex-col items-center">

    <div class="w-full max-w-4xl">
        <h1 class="text-4xl font-bold mb-6 text-center neon-text tracking-widest">CYBER SWARM UPLINK</h1>

        <div class="mb-8 p-6 neon-border bg-black/50 backdrop-blur-sm rounded">
            <h2 class="text-xl mb-4 text-[#ff00ff] uppercase tracking-wide">Command Directive</h2>
            <form id="taskForm" class="flex gap-4">
                <input type="text" id="taskInput"
                       class="flex-1 bg-transparent border-b-2 border-[#005555] p-2 text-[#00ffcc] focus:outline-none focus:border-[#00ffcc] transition-colors placeholder-[#005555]"
                       placeholder="Enter agentic task (e.g., 'Write a python script to list files')..." required>
                <button type="submit"
                        class="px-6 py-2 border border-[#00ffcc] text-[#00ffcc] hover:bg-[#00ffcc] hover:text-black transition-all uppercase font-bold tracking-wider">
                    Execute
                </button>
            </form>
        </div>

        <div class="neon-border rounded bg-black/80 relative">
            <div class="absolute top-0 left-0 w-full h-8 bg-[#001111] border-b border-[#005555] flex items-center px-4">
                <span class="text-xs text-[#005555] uppercase">Terminal Output // Swarm Status: Active</span>
            </div>
            <div id="logWindow" class="log-container mt-8 font-mono text-sm">
                <div class="log-line system">Initialization sequence complete. Waiting for directives...</div>
            </div>
        </div>
    </div>


    <script>
        const logWindow = document.getElementById('logWindow');
        const taskForm = document.getElementById('taskForm');
        const taskInput = document.getElementById('taskInput');

        // Connect to WebSocket
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws`;

        let ws;

        function connect() {
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                appendLog('System uplink established.', 'system');
            };

            ws.onmessage = (event) => {
                const msg = event.data;
                let type = 'default';

                if (msg.includes('⚡') || msg.includes('🧠') || msg.includes('🚀')) type = 'system';
                else if (msg.includes('▶️') || msg.includes('⚙️') || msg.includes('🤔')) type = 'action';
                else if (msg.includes('✅') || msg.includes('🟢') || msg.includes('💾') || msg.includes('🏁')) type = 'success';
                else if (msg.includes('❌') || msg.includes('🔴') || msg.includes('⚠️')) type = 'error';

                appendLog(msg, type);
            };

            ws.onclose = () => {
                appendLog('Uplink disconnected. Attempting reconnect...', 'error');
                setTimeout(connect, 3000);
            };
        }

        function appendLog(message, type='default') {
            const div = document.createElement('div');
            div.className = `log-line ${type}`;
            div.textContent = `> ${message}`;
            logWindow.appendChild(div);
            // Auto scroll to bottom
            logWindow.scrollTop = logWindow.scrollHeight;
        }

        taskForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const task = taskInput.value.trim();
            if (!task) return;

            appendLog(`Initiating directive: "${task}"`, 'system');
            taskInput.value = '';

            try {
                const response = await fetch('/api/task', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task: task })
                });

                if (!response.ok) {
                    appendLog('Failed to transmit directive to swarm.', 'error');
                }
            } catch (err) {
                appendLog(`Transmission error: ${err.message}`, 'error');
            }
        });

        // Initialize connection
        connect();
    </script>

</body>
</html>
