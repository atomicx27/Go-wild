<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept Weaver</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --primary-glow: #00ffcc;
            --secondary-glow: #ff00ff;
            --text-color: #e0e0e0;
            --panel-bg: rgba(11, 15, 25, 0.85);
            --border-color: rgba(0, 255, 204, 0.4);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        #app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        #main-content {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        #header {
            padding: 20px;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 0 0 10px var(--primary-glow), 0 0 20px var(--primary-glow);
            letter-spacing: 2px;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { text-shadow: 0 0 10px var(--primary-glow), 0 0 20px var(--primary-glow); }
            100% { text-shadow: 0 0 15px var(--primary-glow), 0 0 30px var(--primary-glow), 0 0 40px var(--secondary-glow); }
        }

        #search-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            pointer-events: auto;
            transition: all 0.3s ease;
        }

        #search-container:focus-within {
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.5);
            border-color: var(--primary-glow);
        }

        #topic-input {
            background: transparent;
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: 1.2rem;
            width: 300px;
            outline: none;
            padding: 5px 10px;
        }

        #topic-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        #weave-btn {
            background: transparent;
            border: 1px solid var(--primary-glow);
            color: var(--primary-glow);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        #weave-btn:hover {
            background: var(--primary-glow);
            color: var(--bg-color);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        #network-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #side-panel {
            width: 350px;
            background: var(--panel-bg);
            border-left: 2px solid var(--border-color);
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            z-index: 20;
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.5);
        }

        #side-panel.open {
            transform: translateX(0);
        }

        #node-title {
            color: var(--secondary-glow);
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 20px;
            text-shadow: 0 0 5px var(--secondary-glow);
            border-bottom: 1px solid rgba(255, 0, 255, 0.3);
            padding-bottom: 10px;
        }

        #node-desc {
            line-height: 1.6;
            font-size: 1.1rem;
            color: #ccc;
            flex-grow: 1;
            overflow-y: auto;
        }

        #close-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        #close-panel:hover {
            color: var(--secondary-glow);
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            color: var(--primary-glow);
            font-size: 1.5rem;
            display: none;
            text-align: center;
            background: var(--panel-bg);
            padding: 20px 40px;
            border-radius: 10px;
            border: 1px solid var(--primary-glow);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 255, 204, 0.1);
            border-top: 4px solid var(--primary-glow);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Custom Scrollbar for side panel */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 204, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 204, 0.6);
        }

        #header h1 {
            background: linear-gradient(90deg, var(--primary-glow), var(--secondary-glow), var(--primary-glow));
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 3s linear infinite;
        }
        @keyframes shine {
            to { background-position: 200% center; }
        }
        #side-panel {
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(10px);
        }
        #weave-btn:hover {
            box-shadow: 0 0 15px var(--secondary-glow);
            text-shadow: 0 0 5px #fff;
        }
</style>
</head>
<body>

<div id="app-container">
    <div id="main-content">
        <div id="header">
            <h1>CONCEPT WEAVER</h1>
        </div>

        <div id="network-container"></div>

        <div id="loading">
            <div class="spinner"></div>
            Weaving Concepts...
        </div>

        <div id="search-container">
            <input type="text" id="topic-input" placeholder="Enter a concept..." autocomplete="off">
            <button id="weave-btn">Weave</button>
        </div>
    </div>

    <div id="side-panel">
        <button id="close-panel">&times;</button>
        <h2 id="node-title">Node</h2>
        <div id="node-desc">Click on a node to reveal its secrets.</div>
    </div>
</div>

<script>
    let network = null;
    let nodesData = new vis.DataSet();
    let edgesData = new vis.DataSet();

    const container = document.getElementById('network-container');
    const data = {
        nodes: nodesData,
        edges: edgesData
    };
    const options = {
        nodes: {
            shape: 'dot',
            size: 20,
            font: {
                size: 14,
                color: '#ffffff',
                face: 'Courier New',
                strokeWidth: 2,
                strokeColor: '#000000'
            },
            borderWidth: 2,
            color: {
                border: '#00ffcc',
                background: '#0b0f19',
                highlight: {
                    border: '#ff00ff',
                    background: '#2a0a2a'
                },
                hover: {
                    border: '#ffffff',
                    background: '#1a1a1a'
                }
            },
            shadow: {
                enabled: true,
                color: '#00ffcc',
                size: 10,
                x: 0,
                y: 0
            }
        },
        edges: {
            width: 2,
            color: {
                color: 'rgba(0, 255, 204, 0.4)',
                highlight: '#ff00ff',
                hover: '#ffffff'
            },
            smooth: {
                type: 'continuous'
            },
            font: {
                color: '#a0a0a0',
                size: 10,
                face: 'Courier New',
                strokeWidth: 0,
                align: 'middle'
            },
            arrows: {
                to: { enabled: true, scaleFactor: 0.5 }
            }
        },
        physics: {
            forceAtlas2Based: {
                gravitationalConstant: -50,
                centralGravity: 0.01,
                springLength: 100,
                springConstant: 0.08
            },
            maxVelocity: 50,
            solver: 'forceAtlas2Based',
            timestep: 0.35,
            stabilization: { iterations: 150 }
        },
        interaction: {
            hover: true,
            tooltipDelay: 200,
            zoomView: true,
            dragView: true
        }
    };

    network = new vis.Network(container, data, options);

    // Interaction handlers
    const sidePanel = document.getElementById('side-panel');
    const nodeTitle = document.getElementById('node-title');
    const nodeDesc = document.getElementById('node-desc');
    const closeBtn = document.getElementById('close-panel');

    network.on("click", function (params) {
        if (params.nodes.length > 0) {
            const nodeId = params.nodes[0];
            const node = nodesData.get(nodeId);

            nodeTitle.textContent = node.label;
            nodeDesc.textContent = node.title || "No description available.";

            sidePanel.classList.add('open');

            // Highlight effect
            network.focus(nodeId, {
                scale: 1.2,
                animation: {
                    duration: 1000,
                    easingFunction: "easeInOutQuad"
                }
            });
        }
    });

    closeBtn.addEventListener('click', () => {
        sidePanel.classList.remove('open');
        network.fit({
            animation: {
                duration: 1000,
                easingFunction: "easeInOutQuad"
            }
        });
    });

    // API Interaction
    const topicInput = document.getElementById('topic-input');
    const weaveBtn = document.getElementById('weave-btn');
    const loading = document.getElementById('loading');

    async function weaveConcept() {
        const topic = topicInput.value.trim();
        if (!topic) return;

        loading.style.display = 'block';
        weaveBtn.disabled = true;
        sidePanel.classList.remove('open');

        try {
            const response = await fetch('/api/weave', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ topic })
            });

            if (!response.ok) {
                throw new Error(`Server returned ${response.status}`);
            }

            const graphData = await response.json();

            // Clear existing
            nodesData.clear();
            edgesData.clear();

            // Process nodes to ensure root node (id 1 usually) is prominent
            if (graphData.nodes) {
                const processedNodes = graphData.nodes.map(n => {
                    if (n.id === 1 || n.id === "1") {
                        return { ...n, size: 35, color: { border: '#ff00ff', background: '#2a0a2a' }, shadow: { color: '#ff00ff', size: 20 } };
                    }
                    return n;
                });
                nodesData.add(processedNodes);
            }

            if (graphData.edges) {
                edgesData.add(graphData.edges);
            }

            network.fit({
                animation: {
                    duration: 1000,
                    easingFunction: "easeInOutQuad"
                }
            });

        } catch (error) {
            console.error("Failed to weave:", error);
            alert("Failed to weave concept. Check server logs.");
        } finally {
            loading.style.display = 'none';
            weaveBtn.disabled = false;
        }
    }

    weaveBtn.addEventListener('click', weaveConcept);
    topicInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') weaveConcept();
    });

    // Initial dummy data for visual flair
    nodesData.add([
        {id: 1, label: 'Concept Weaver', title: 'An autonomous agentic workflow for knowledge deconstruction.', size: 30, color: { border: '#ff00ff' }},
        {id: 2, label: 'Ollama', title: 'Local LLM engine powering the intelligence.'},
        {id: 3, label: 'Cyberpunk UI', title: 'Glowing, modern web interface.'},
        {id: 4, label: 'Vis-Network', title: 'Physics-based graph rendering library.'}
    ]);
    edgesData.add([
        {from: 1, to: 2, label: 'powered by'},
        {from: 1, to: 3, label: 'features'},
        {from: 3, to: 4, label: 'uses'}
    ]);

</script>

<script>
(function() {
    // 1. Inject Styles
    const style = document.createElement('style');
    style.innerHTML = `
        /* Cyberpunk & Glassmorphism Core */
        .glass-panel {
            background: rgba(16, 24, 39, 0.7) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(34, 211, 238, 0.3) !important;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37) !important;
        }

        /* Interactive Neon Hover */
        .neon-hover {
            transition: all 0.3s ease !important;
        }
        .neon-hover:hover {
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.6), inset 0 0 10px rgba(34, 211, 238, 0.4) !important;
            transform: translateY(-2px) !important;
        }

        /* Ripple Effect */
        .ripple-container {
            position: relative;
            /* Do not force overflow hidden globally to avoid breaking dropdowns */
        }
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            background-color: rgba(255, 255, 255, 0.3);
            pointer-events: none;
        }
        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Custom Cursor Trail */
        .cursor-trail {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(34, 211, 238, 0.8);
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.8);
            will-change: transform;
        }

        /* Entrance Animation */
        .fade-in-up {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        .fade-in-up.visible {
            opacity: 1;
            transform: translateY(0);
        }
    `;
    document.head.appendChild(style);

    // 2. Add Ripple Effect to Buttons
    document.addEventListener('click', function(e) {
        const target = e.target.closest('button, .btn, a');
        if (!target) return;

        // Create an isolated container for the ripple to avoid forcing overflow hidden on the button itself
        let rippleContainer = target.querySelector('.ripple-wrapper');
        if (!rippleContainer) {
            rippleContainer = document.createElement('div');
            rippleContainer.className = 'ripple-wrapper';
            rippleContainer.style.position = 'absolute';
            rippleContainer.style.top = '0';
            rippleContainer.style.left = '0';
            rippleContainer.style.width = '100%';
            rippleContainer.style.height = '100%';
            rippleContainer.style.overflow = 'hidden';
            rippleContainer.style.borderRadius = window.getComputedStyle(target).borderRadius;
            rippleContainer.style.pointerEvents = 'none';

            if (window.getComputedStyle(target).position === 'static') {
                target.style.position = 'relative';
            }
            target.appendChild(rippleContainer);
        }

        const circle = document.createElement('span');
        const diameter = Math.max(target.clientWidth, target.clientHeight);
        const radius = diameter / 2;

        const rect = target.getBoundingClientRect();
        circle.style.width = circle.style.height = `${diameter}px`;
        circle.style.left = `${e.clientX - rect.left - radius}px`;
        circle.style.top = `${e.clientY - rect.top - radius}px`;
        circle.classList.add('ripple');

        rippleContainer.appendChild(circle);

        setTimeout(() => {
            circle.remove();
        }, 600);
    });

    // 3. Cursor Trail Optimization
    const trails = [];
    const numTrails = 10;
    let mouseX = 0;
    let mouseY = 0;

    for (let i = 0; i < numTrails; i++) {
        const trail = document.createElement('div');
        trail.className = 'cursor-trail';
        document.body.appendChild(trail);
        trails.push({ element: trail, x: 0, y: 0 });
    }

    document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });

    function animateTrails() {
        let x = mouseX;
        let y = mouseY;

        trails.forEach((trail, index) => {
            const nextTrail = trails[index + 1] || trails[0];

            trail.x += (x - trail.x) * 0.3;
            trail.y += (y - trail.y) * 0.3;

            trail.element.style.transform = `translate(${trail.x}px, ${trail.y}px) scale(${(numTrails - index) / numTrails})`;

            x = trail.x;
            y = trail.y;
        });

        requestAnimationFrame(animateTrails);
    }
    animateTrails();

    // 4. Entrance Animations (Intersection Observer)
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
            }
        });
    }, { threshold: 0.1 });

    function applyEnhancements() {
        // Apply neon hover to interactive elements
        document.querySelectorAll('input, button, .card, .panel').forEach(el => {
            if (!el.classList.contains('neon-hover')) {
                el.classList.add('neon-hover');
            }
        });

        // Apply glassmorphism to containers
        document.querySelectorAll('.card, .panel, header, nav').forEach(el => {
             if (!el.classList.contains('glass-panel')) {
                 //el.classList.add('glass-panel');
             }
        });

        // Apply fade-in-up to main containers
        document.querySelectorAll('div > p, div > h1, div > h2, div > h3, .card, .panel').forEach(el => {
            if (!el.classList.contains('fade-in-up')) {
                el.classList.add('fade-in-up');
                observer.observe(el);
            }
        });
    }

    // Apply on load
    window.addEventListener('DOMContentLoaded', applyEnhancements);

    // Apply continuously for dynamically added elements using MutationObserver
    const mutationObserver = new MutationObserver(() => {
        applyEnhancements();
    });

    // Ensure body exists before observing
    if(document.body) {
        mutationObserver.observe(document.body, { childList: true, subtree: true });
    } else {
        window.addEventListener('DOMContentLoaded', () => {
            mutationObserver.observe(document.body, { childList: true, subtree: true });
        });
    }

})();
</script>

</body>
</html>
