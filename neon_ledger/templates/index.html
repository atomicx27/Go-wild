<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
        }
        .neon-border {
            border: 1px solid #00ffcc;
            box-shadow: 0 0 10px #00ffcc, inset 0 0 10px #00ffcc;
        }
        .neon-text {
            text-shadow: 0 0 5px #00ffcc, 0 0 10px #00ffcc;
        }
        .report-box p { margin-bottom: 1rem; }
        .report-box b { color: #ff00ff; text-shadow: 0 0 5px #ff00ff; }

        /* Glitch effect for header */
        .glitch {
            position: relative;
            display: inline-block;
        }
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
        }
        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 #ff00c1;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 #00fff9, 2px 2px #ff00c1;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 86px, 0); }
            5% { clip: rect(17px, 9999px, 94px, 0); }
            10% { clip: rect(69px, 9999px, 14px, 0); }
            15% { clip: rect(3px, 9999px, 99px, 0); }
            20% { clip: rect(74px, 9999px, 40px, 0); }
            25% { clip: rect(10px, 9999px, 90px, 0); }
            30% { clip: rect(81px, 9999px, 54px, 0); }
            35% { clip: rect(35px, 9999px, 19px, 0); }
            40% { clip: rect(98px, 9999px, 78px, 0); }
            45% { clip: rect(25px, 9999px, 35px, 0); }
            50% { clip: rect(85px, 9999px, 18px, 0); }
            55% { clip: rect(16px, 9999px, 96px, 0); }
            60% { clip: rect(75px, 9999px, 20px, 0); }
            65% { clip: rect(45px, 9999px, 84px, 0); }
            70% { clip: rect(8px, 9999px, 51px, 0); }
            75% { clip: rect(94px, 9999px, 63px, 0); }
            80% { clip: rect(30px, 9999px, 23px, 0); }
            85% { clip: rect(65px, 9999px, 99px, 0); }
            90% { clip: rect(11px, 9999px, 33px, 0); }
            95% { clip: rect(87px, 9999px, 48px, 0); }
            100% { clip: rect(2px, 9999px, 70px, 0); }
        }
        @keyframes glitch-anim2 {
            0% { clip: rect(65px, 9999px, 94px, 0); }
            5% { clip: rect(52px, 9999px, 19px, 0); }
            10% { clip: rect(8px, 9999px, 77px, 0); }
            15% { clip: rect(40px, 9999px, 34px, 0); }
            20% { clip: rect(91px, 9999px, 10px, 0); }
            25% { clip: rect(20px, 9999px, 85px, 0); }
            30% { clip: rect(77px, 9999px, 50px, 0); }
            35% { clip: rect(15px, 9999px, 25px, 0); }
            40% { clip: rect(99px, 9999px, 70px, 0); }
            45% { clip: rect(34px, 9999px, 5px, 0); }
            50% { clip: rect(88px, 9999px, 44px, 0); }
            55% { clip: rect(10px, 9999px, 80px, 0); }
            60% { clip: rect(60px, 9999px, 15px, 0); }
            65% { clip: rect(25px, 9999px, 90px, 0); }
            70% { clip: rect(70px, 9999px, 40px, 0); }
            75% { clip: rect(5px, 9999px, 60px, 0); }
            80% { clip: rect(80px, 9999px, 20px, 0); }
            85% { clip: rect(45px, 9999px, 95px, 0); }
            90% { clip: rect(15px, 9999px, 50px, 0); }
            95% { clip: rect(95px, 9999px, 30px, 0); }
            100% { clip: rect(50px, 9999px, 80px, 0); }
        }
    </style>
</head>
<body class="p-8 min-h-screen">

    <header class="text-center mb-12">
        <h1 class="text-6xl font-bold neon-text glitch" data-text="NEON LEDGER">NEON LEDGER</h1>
        <p class="text-xl mt-4 text-[#ff00ff]" style="text-shadow: 0 0 5px #ff00ff;">Autonomous Cyberpunk Financial Analyst</p>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- Left Column: Report & Chart -->
        <div class="lg:col-span-1 space-y-8">
            <section class="neon-border p-6 bg-black/50 backdrop-blur">
                <h2 class="text-2xl font-semibold mb-4 text-[#ff00ff]" style="text-shadow: 0 0 5px #ff00ff;">AI Analysis</h2>
                <div id="report-content" class="report-box text-sm leading-relaxed text-gray-300">
                    Loading analysis...
                </div>
            </section>

            <section class="neon-border p-6 bg-black/50 backdrop-blur">
                <h2 class="text-2xl font-semibold mb-4 text-[#00ffcc] neon-text">Spending Distribution</h2>
                <div class="relative h-64">
                    <canvas id="spendingChart"></canvas>
                </div>
            </section>
        </div>

        <!-- Right Column: Transactions -->
        <div class="lg:col-span-2">
            <section class="neon-border p-6 bg-black/50 backdrop-blur min-h-full">
                <h2 class="text-2xl font-semibold mb-4 text-[#00ffcc] neon-text">Ledger Output</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-[#00ffcc]">
                                <th class="p-3">Date</th>
                                <th class="p-3">Description</th>
                                <th class="p-3">Category</th>
                                <th class="p-3 text-right">Amount</th>
                            </tr>
                        </thead>
                        <tbody id="transactions-body">
                            <tr><td colspan="4" class="p-3 text-center text-gray-500">Awaiting data injection...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>

    </main>

    <script>
        let spendingChart = null;

        async function fetchData() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();

                // Update Report
                document.getElementById('report-content').innerHTML = data.report;

                // Update Transactions
                const tbody = document.getElementById('transactions-body');
                if (data.transactions.length > 0) {
                    tbody.innerHTML = data.transactions.map(t => `
                        <tr class="border-b border-[#00ffcc]/30 hover:bg-[#00ffcc]/10 transition-colors">
                            <td class="p-3 text-gray-400">${t.date}</td>
                            <td class="p-3">${t.description}</td>
                            <td class="p-3 text-[#ff00ff]">${t.category}</td>
                            <td class="p-3 text-right font-bold ${t.amount < 0 ? 'text-red-500' : 'text-[#00ffcc]'}">${t.amount.toFixed(2)}</td>
                        </tr>
                    `).join('');
                }

                // Update Chart
                const ctx = document.getElementById('spendingChart').getContext('2d');
                const labels = Object.keys(data.categories);
                const values = Object.values(data.categories).map(Math.abs); // Chart positive values

                if (spendingChart) {
                    spendingChart.data.labels = labels;
                    spendingChart.data.datasets[0].data = values;
                    spendingChart.update();
                } else if (labels.length > 0) {
                    spendingChart = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: labels,
                            datasets: [{
                                data: values,
                                backgroundColor: [
                                    '#00ffcc', '#ff00ff', '#ffff00', '#ff0000', '#0000ff', '#ffffff'
                                ],
                                borderColor: '#0a0a0a',
                                borderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                    labels: { color: '#00ffcc' }
                                }
                            }
                        }
                    });
                }
            } catch (error) {
                console.error("Data sync failed:", error);
            }
        }

        // Initial fetch
        fetchData();

        // Poll every 5 seconds
        setInterval(fetchData, 5000);
    </script>
</body>
</html>
