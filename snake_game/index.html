<!DOCTYPE html>
<html>
<head>
  <title>Snake Game</title>
  <style>
    body {
      background: linear-gradient(45deg, #0a0a0a, #1a1a1a, #0f172a, #000000);
      background-size: 400% 400%;
      animation: gradientBG 8s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      position: relative;
    }

    body::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 2;
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    #game-container {
      text-align: center;
      z-index: 10;
      position: relative;
      animation: popIn 0.5s ease-out forwards;
    }
    canvas {
      background-color: #222;
      border: 2px solid #4CAF50;
      box-shadow: 0 0 15px rgba(76, 175, 80, 0.3);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
      border-radius: 4px;
    }
    canvas:hover {
      box-shadow: 0 0 80px rgba(76, 175, 80, 1), 0 0 30px rgba(0, 255, 0, 0.6) inset;
      transform: scale(1.02);
    }
    h1 {
      margin-top: 0;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      letter-spacing: 2px;
    }
    #score {
      font-size: 1.5em;
      margin-bottom: 15px;
      transition: color 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), text-shadow 0.3s ease;
      font-weight: bold;
    }
    .score-pulse {
      color: #4CAF50 !important;
      transform: scale(1.4);
      text-shadow: 0 0 30px #4CAF50, 0 0 60px #4CAF50;
    }
  </style>
</head>
<body>

<div id="game-container">
  <h1>Snake</h1>
  <div id="score">Score: 0</div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <p>Use arrow keys to play.</p>
</div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const scoreElement = document.getElementById("score");

  const gridSize = 20;
  const tileCount = canvas.width / gridSize;

  let snake = [
    {x: 10, y: 10}
  ];
  let dx = 0;
  let dy = 0;
  let foodX = 15;
  let foodY = 15;
  let score = 0;
  let speed = 100;
  let gameLoop;

  function drawGame() {
    clearScreen();
    drawFood();
    moveSnake();
    drawSnake();
    checkGameOver();
  }

  function clearScreen() {
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#333";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function drawSnake() {
    ctx.shadowBlur = 15 + Math.sin(Date.now() / 150) * 15;
    ctx.shadowColor = "lime";
    ctx.fillStyle = "lime";
    for (let i = 0; i < snake.length; i++) {
      ctx.fillRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize - 2, gridSize - 2);
    }
  }

  function moveSnake() {
    const head = {x: snake[0].x + dx, y: snake[0].y + dy};
    snake.unshift(head);

    if (head.x === foodX && head.y === foodY) {
      score += 10;
      scoreElement.innerText = "Score: " + score;
      scoreElement.classList.add('score-pulse');
      setTimeout(() => scoreElement.classList.remove('score-pulse'), 150);
      generateFood();
    } else {
      snake.pop();
    }
  }

  function drawFood() {
    ctx.shadowBlur = 20 + Math.sin(Date.now() / 100) * 15;
    ctx.shadowColor = "red";
    ctx.fillStyle = "red";
    ctx.fillRect(foodX * gridSize, foodY * gridSize, gridSize - 2, gridSize - 2);
  }

  function generateFood() {
    foodX = Math.floor(Math.random() * tileCount);
    foodY = Math.floor(Math.random() * tileCount);

    // Check if food spawns on snake
    for(let part of snake) {
      if(part.x === foodX && part.y === foodY) {
        generateFood();
        break;
      }
    }
  }

  function checkGameOver() {
    let gameOver = false;

    // Wall collision
    if (snake[0].x < 0 || snake[0].x >= tileCount || snake[0].y < 0 || snake[0].y >= tileCount) {
      gameOver = true;
    }

    // Self collision
    for (let i = 1; i < snake.length; i++) {
      if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) {
        gameOver = true;
      }
    }

    if (gameOver) {
      clearInterval(gameLoop);
      ctx.shadowBlur = 20;
      ctx.shadowColor = "red";
      ctx.fillStyle = "#ff4444";
      ctx.font = "bold 40px Courier New";
      ctx.textAlign = "center";
      ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
      ctx.shadowBlur = 10;
      ctx.shadowColor = "white";
      ctx.fillStyle = "white";
      ctx.font = "18px Courier New";
      ctx.fillText("Press Space to restart", canvas.width / 2, canvas.height / 2 + 40);
    }
  }

  function resetGame() {
      snake = [{x: 10, y: 10}];
      dx = 0;
      dy = 0;
      score = 0;
      scoreElement.innerText = "Score: " + score;
      generateFood();
      clearInterval(gameLoop);
      gameLoop = setInterval(drawGame, speed);
  }

  document.addEventListener("keydown", (event) => {
    // Prevent default scrolling for arrow keys
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].indexOf(event.code) > -1) {
        event.preventDefault();
    }

    if (event.key === "ArrowUp" && dy !== 1) {
      dx = 0;
      dy = -1;
    } else if (event.key === "ArrowDown" && dy !== -1) {
      dx = 0;
      dy = 1;
    } else if (event.key === "ArrowLeft" && dx !== 1) {
      dx = -1;
      dy = 0;
    } else if (event.key === "ArrowRight" && dx !== -1) {
      dx = 1;
      dy = 0;
    } else if (event.code === "Space") {
        resetGame();
    }
  });

  gameLoop = setInterval(drawGame, speed);

</script>

<script>
(function() {
    // 1. Inject Styles
    const style = document.createElement('style');
    style.innerHTML = `
        /* Cyberpunk & Glassmorphism Core */
        .glass-panel {
            background: rgba(16, 24, 39, 0.7) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(34, 211, 238, 0.3) !important;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37) !important;
        }

        /* Interactive Neon Hover */
        .neon-hover {
            transition: all 0.3s ease !important;
        }
        .neon-hover:hover {
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.6), inset 0 0 10px rgba(34, 211, 238, 0.4) !important;
            transform: translateY(-2px) !important;
        }

        /* Ripple Effect */
        .ripple-container {
            position: relative;
            /* Do not force overflow hidden globally to avoid breaking dropdowns */
        }
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            background-color: rgba(255, 255, 255, 0.3);
            pointer-events: none;
        }
        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Custom Cursor Trail */
        .cursor-trail {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(34, 211, 238, 0.8);
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.8);
            will-change: transform;
        }

        /* Entrance Animation */
        .fade-in-up {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        .fade-in-up.visible {
            opacity: 1;
            transform: translateY(0);
        }
    `;
    document.head.appendChild(style);

    // 2. Add Ripple Effect to Buttons
    document.addEventListener('click', function(e) {
        const target = e.target.closest('button, .btn, a');
        if (!target) return;

        // Create an isolated container for the ripple to avoid forcing overflow hidden on the button itself
        let rippleContainer = target.querySelector('.ripple-wrapper');
        if (!rippleContainer) {
            rippleContainer = document.createElement('div');
            rippleContainer.className = 'ripple-wrapper';
            rippleContainer.style.position = 'absolute';
            rippleContainer.style.top = '0';
            rippleContainer.style.left = '0';
            rippleContainer.style.width = '100%';
            rippleContainer.style.height = '100%';
            rippleContainer.style.overflow = 'hidden';
            rippleContainer.style.borderRadius = window.getComputedStyle(target).borderRadius;
            rippleContainer.style.pointerEvents = 'none';

            if (window.getComputedStyle(target).position === 'static') {
                target.style.position = 'relative';
            }
            target.appendChild(rippleContainer);
        }

        const circle = document.createElement('span');
        const diameter = Math.max(target.clientWidth, target.clientHeight);
        const radius = diameter / 2;

        const rect = target.getBoundingClientRect();
        circle.style.width = circle.style.height = `${diameter}px`;
        circle.style.left = `${e.clientX - rect.left - radius}px`;
        circle.style.top = `${e.clientY - rect.top - radius}px`;
        circle.classList.add('ripple');

        rippleContainer.appendChild(circle);

        setTimeout(() => {
            circle.remove();
        }, 600);
    });

    // 3. Cursor Trail Optimization
    const trails = [];
    const numTrails = 10;
    let mouseX = 0;
    let mouseY = 0;

    for (let i = 0; i < numTrails; i++) {
        const trail = document.createElement('div');
        trail.className = 'cursor-trail';
        document.body.appendChild(trail);
        trails.push({ element: trail, x: 0, y: 0 });
    }

    document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });

    function animateTrails() {
        let x = mouseX;
        let y = mouseY;

        trails.forEach((trail, index) => {
            const nextTrail = trails[index + 1] || trails[0];

            trail.x += (x - trail.x) * 0.3;
            trail.y += (y - trail.y) * 0.3;

            trail.element.style.transform = `translate(${trail.x}px, ${trail.y}px) scale(${(numTrails - index) / numTrails})`;

            x = trail.x;
            y = trail.y;
        });

        requestAnimationFrame(animateTrails);
    }
    animateTrails();

    // 4. Entrance Animations (Intersection Observer)
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
            }
        });
    }, { threshold: 0.1 });

    function applyEnhancements() {
        // Apply neon hover to interactive elements
        document.querySelectorAll('input, button, .card, .panel').forEach(el => {
            if (!el.classList.contains('neon-hover')) {
                el.classList.add('neon-hover');
            }
        });

        // Apply glassmorphism to containers
        document.querySelectorAll('.card, .panel, header, nav').forEach(el => {
             if (!el.classList.contains('glass-panel')) {
                 //el.classList.add('glass-panel');
             }
        });

        // Apply fade-in-up to main containers
        document.querySelectorAll('div > p, div > h1, div > h2, div > h3, .card, .panel').forEach(el => {
            if (!el.classList.contains('fade-in-up')) {
                el.classList.add('fade-in-up');
                observer.observe(el);
            }
        });
    }

    // Apply on load
    window.addEventListener('DOMContentLoaded', applyEnhancements);

    // Apply continuously for dynamically added elements using MutationObserver
    const mutationObserver = new MutationObserver(() => {
        applyEnhancements();
    });

    // Ensure body exists before observing
    if(document.body) {
        mutationObserver.observe(document.body, { childList: true, subtree: true });
    } else {
        window.addEventListener('DOMContentLoaded', () => {
            mutationObserver.observe(document.body, { childList: true, subtree: true });
        });
    }

})();
</script>

</body>
</html>
