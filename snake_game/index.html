<!DOCTYPE html>
<html>
<head>
  <title>Snake Game</title>
  <style>
    body {
      background: linear-gradient(45deg, #0a0a0a, #1a1a1a, #0f172a, #000000);
      background-size: 400% 400%;
      animation: gradientBG 8s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      position: relative;
    }

    body::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 2;
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    #game-container {
      text-align: center;
      z-index: 10;
      position: relative;
      animation: popIn 0.5s ease-out forwards;
    }
    canvas {
      background-color: #222;
      border: 2px solid #4CAF50;
      box-shadow: 0 0 15px rgba(76, 175, 80, 0.3);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
      border-radius: 4px;
    }
    canvas:hover {
      box-shadow: 0 0 80px rgba(76, 175, 80, 1), 0 0 30px rgba(0, 255, 0, 0.6) inset;
      transform: scale(1.02);
    }
    h1 {
      margin-top: 0;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      letter-spacing: 2px;
    }
    #score {
      font-size: 1.5em;
      margin-bottom: 15px;
      transition: color 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), text-shadow 0.3s ease;
      font-weight: bold;
    }
    .score-pulse {
      color: #4CAF50 !important;
      transform: scale(1.4);
      text-shadow: 0 0 30px #4CAF50, 0 0 60px #4CAF50;
    }
  </style>
</head>
<body>

<div id="game-container">
  <h1>Snake</h1>
  <div id="score">Score: 0</div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <p>Use arrow keys to play.</p>
</div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const scoreElement = document.getElementById("score");

  const gridSize = 20;
  const tileCount = canvas.width / gridSize;

  let snake = [
    {x: 10, y: 10}
  ];
  let dx = 0;
  let dy = 0;
  let foodX = 15;
  let foodY = 15;
  let score = 0;
  let speed = 100;
  let gameLoop;

  function drawGame() {
    clearScreen();
    drawFood();
    moveSnake();
    drawSnake();
    checkGameOver();
  }

  function clearScreen() {
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#333";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function drawSnake() {
    ctx.shadowBlur = 15 + Math.sin(Date.now() / 150) * 15;
    ctx.shadowColor = "lime";
    ctx.fillStyle = "lime";
    for (let i = 0; i < snake.length; i++) {
      ctx.fillRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize - 2, gridSize - 2);
    }
  }

  function moveSnake() {
    const head = {x: snake[0].x + dx, y: snake[0].y + dy};
    snake.unshift(head);

    if (head.x === foodX && head.y === foodY) {
      score += 10;
      scoreElement.innerText = "Score: " + score;
      scoreElement.classList.add('score-pulse');
      setTimeout(() => scoreElement.classList.remove('score-pulse'), 150);
      generateFood();
    } else {
      snake.pop();
    }
  }

  function drawFood() {
    ctx.shadowBlur = 20 + Math.sin(Date.now() / 100) * 15;
    ctx.shadowColor = "red";
    ctx.fillStyle = "red";
    ctx.fillRect(foodX * gridSize, foodY * gridSize, gridSize - 2, gridSize - 2);
  }

  function generateFood() {
    foodX = Math.floor(Math.random() * tileCount);
    foodY = Math.floor(Math.random() * tileCount);

    // Check if food spawns on snake
    for(let part of snake) {
      if(part.x === foodX && part.y === foodY) {
        generateFood();
        break;
      }
    }
  }

  function checkGameOver() {
    let gameOver = false;

    // Wall collision
    if (snake[0].x < 0 || snake[0].x >= tileCount || snake[0].y < 0 || snake[0].y >= tileCount) {
      gameOver = true;
    }

    // Self collision
    for (let i = 1; i < snake.length; i++) {
      if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) {
        gameOver = true;
      }
    }

    if (gameOver) {
      clearInterval(gameLoop);
      ctx.shadowBlur = 20;
      ctx.shadowColor = "red";
      ctx.fillStyle = "#ff4444";
      ctx.font = "bold 40px Courier New";
      ctx.textAlign = "center";
      ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
      ctx.shadowBlur = 10;
      ctx.shadowColor = "white";
      ctx.fillStyle = "white";
      ctx.font = "18px Courier New";
      ctx.fillText("Press Space to restart", canvas.width / 2, canvas.height / 2 + 40);
    }
  }

  function resetGame() {
      snake = [{x: 10, y: 10}];
      dx = 0;
      dy = 0;
      score = 0;
      scoreElement.innerText = "Score: " + score;
      generateFood();
      clearInterval(gameLoop);
      gameLoop = setInterval(drawGame, speed);
  }

  document.addEventListener("keydown", (event) => {
    // Prevent default scrolling for arrow keys
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].indexOf(event.code) > -1) {
        event.preventDefault();
    }

    if (event.key === "ArrowUp" && dy !== 1) {
      dx = 0;
      dy = -1;
    } else if (event.key === "ArrowDown" && dy !== -1) {
      dx = 0;
      dy = 1;
    } else if (event.key === "ArrowLeft" && dx !== 1) {
      dx = -1;
      dy = 0;
    } else if (event.key === "ArrowRight" && dx !== -1) {
      dx = 1;
      dy = 0;
    } else if (event.code === "Space") {
        resetGame();
    }
  });

  gameLoop = setInterval(drawGame, speed);

</script>

<!-- START_UI_ENHANCEMENTS -->
<style>
  .modern-ui-enhancement-ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.4);
    pointer-events: none;
    transform: scale(0);
    z-index: 99999;
  }

  .modern-ui-trail-particle {
    position: fixed;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: rgba(139, 92, 246, 0.5);
    pointer-events: none;
    z-index: 99999;
    top: 0;
    left: 0;
    opacity: 0;
    will-change: transform, opacity;
  }
</style>

<script>
(function() {
    // 1. Mouse trail animation
    const numParticles = 10;
    const particles = [];

    for (let i = 0; i < numParticles; i++) {
        const p = document.createElement('div');
        p.className = 'modern-ui-trail-particle';
        document.body.appendChild(p);
        particles.push({
            el: p,
            x: -100,
            y: -100,
            targetX: -100,
            targetY: -100,
            active: false
        });
    }

    let mouseX = -100;
    let mouseY = -100;

    document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        particles[0].targetX = mouseX;
        particles[0].targetY = mouseY;
        particles[0].active = true;
        particles[0].el.style.opacity = 0.8;
    });

    function animateTrail() {
        for (let i = 0; i < numParticles; i++) {
            const p = particles[i];

            if (i === 0) {
                p.x += (p.targetX - p.x) * 0.3;
                p.y += (p.targetY - p.y) * 0.3;
            } else {
                const prev = particles[i - 1];
                p.x += (prev.x - p.x) * 0.3;
                p.y += (prev.y - p.y) * 0.3;
                if (prev.active) {
                    p.active = true;
                    p.el.style.opacity = 0.8 - (i * (0.8 / numParticles));
                }
            }

            if (p.active) {
                p.el.style.transform = `translate3d(${p.x}px, ${p.y}px, 0)`;
            }
        }
        requestAnimationFrame(animateTrail);
    }
    animateTrail();

    // 2. Click animations (Ripple) using Web Animations API
    document.addEventListener('click', (e) => {
        const burst = document.createElement('div');
        burst.className = 'modern-ui-enhancement-ripple';
        burst.style.left = `${e.pageX - 15}px`;
        burst.style.top = `${e.pageY - 15}px`;
        burst.style.width = '30px';
        burst.style.height = '30px';
        document.body.appendChild(burst);

        const animation = burst.animate([
            { transform: 'scale(0)', opacity: 0.8 },
            { transform: 'scale(4)', opacity: 0 }
        ], {
            duration: 400,
            easing: 'ease-out',
            composite: 'add'
        });

        animation.onfinish = () => {
            animation.cancel();
            burst.remove();
        };
    });

    // 3. MutationObserver for subtle fade-in animations on dynamically generated interactive elements
    const observer = new MutationObserver((mutations) => {
        mutations.forEach(mutation => {
            if (mutation.type === 'childList') {
                mutation.addedNodes.forEach(node => {
                    if (node.nodeType === 1) { // Element node
                        if (!node.classList.contains('modern-ui-trail-particle') &&
                            !node.classList.contains('modern-ui-enhancement-ripple')) {

                            const computedStyle = window.getComputedStyle(node);
                            if (computedStyle.display !== 'none' && computedStyle.visibility !== 'hidden') {
                                const anim = node.animate([
                                    { opacity: 0, transform: 'translateY(5px)' },
                                    { opacity: 1, transform: 'translateY(0)' }
                                ], {
                                    duration: 300,
                                    easing: 'ease-out',
                                    composite: 'add'
                                });
                                anim.onfinish = () => anim.cancel();
                            }
                        }
                    }
                });
            }
        });
    });

    observer.observe(document.body, { childList: true, subtree: true });

})();
</script>
<!-- END_UI_ENHANCEMENTS -->
</body>

</html>
