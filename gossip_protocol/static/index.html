<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gossip Protocol Simulation</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --border-color: #30363d;
            --box-bg: #161b22;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.5);
        }
        .container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            gap: 20px;
        }
        .panel {
            background-color: var(--box-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            max-height: 80vh;
        }
        h2 {
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        .agent-card {
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #1f2428;
        }
        .agent-name {
            font-weight: bold;
            color: var(--accent-color);
        }
        .memory-list {
            list-style-type: none;
            padding: 0;
            font-size: 0.9em;
        }
        .memory-list li {
            margin-bottom: 5px;
            padding-left: 10px;
            border-left: 2px solid var(--accent-color);
        }
        .conversation-card {
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #1f2428;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .timestamp {
            font-size: 0.8em;
            color: #8b949e;
            margin-bottom: 5px;
            display: block;
        }
    </style>
</head>
<body>
    <h1>Gossip Protocol Dashboard</h1>
    <div class="container">
        <div class="panel" id="agents-panel">
            <h2>Agents & Memories</h2>
            <div id="agents-container">Loading agents...</div>
        </div>
        <div class="panel" id="conversations-panel">
            <h2>Live Feed</h2>
            <div id="conversations-container">Waiting for gossip...</div>
        </div>
    </div>

    <script>
        async function fetchAgents() {
            const response = await fetch('/api/agents');
            return await response.json();
        }

        async function fetchMemories(agentId) {
            const response = await fetch(`/api/agents/${agentId}/memories`);
            return await response.json();
        }

        async function fetchConversations() {
            const response = await fetch('/api/conversations?limit=15');
            return await response.json();
        }

        async function updateDashboard() {
            try {
                // Update Agents
                const agents = await fetchAgents();
                const agentsContainer = document.getElementById('agents-container');
                agentsContainer.innerHTML = '';

                for (const agent of agents) {
                    const memories = await fetchMemories(agent.id);
                    const memoriesHtml = memories.map(m => `<li>${m.content}</li>`).join('');

                    const agentHtml = `
                        <div class="agent-card">
                            <div class="agent-name">${agent.name}</div>
                            <div style="font-size: 0.8em; color: #8b949e; margin-bottom: 10px;">${agent.persona}</div>
                            <strong>Memories:</strong>
                            <ul class="memory-list">
                                ${memoriesHtml || '<li>No memories yet.</li>'}
                            </ul>
                        </div>
                    `;
                    agentsContainer.innerHTML += agentHtml;
                }

                // Update Conversations
                const conversations = await fetchConversations();
                const conversationsContainer = document.getElementById('conversations-container');
                conversationsContainer.innerHTML = '';

                conversations.forEach(conv => {
                    const convHtml = `
                        <div class="conversation-card">
                            <span class="timestamp">${new Date(conv.timestamp).toLocaleString()}</span>
                            ${conv.transcript}
                        </div>
                    `;
                    conversationsContainer.innerHTML += convHtml;
                });
            } catch (error) {
                console.error("Error updating dashboard:", error);
            }
        }

        // Initial load
        updateDashboard();
        // Poll every 5 seconds
        setInterval(updateDashboard, 5000);
    </script>
</body>
</html>
