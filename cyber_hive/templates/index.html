<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Hive | Autonomous Swarm Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Orbitron:wght@400;700&display=swap');

        body {
            background-color: #0a0a12;
            color: #00ffcc;
            font-family: 'Fira Code', monospace;
            background-image:
                linear-gradient(rgba(0, 255, 204, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 204, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        h1, h2, h3 { font-family: 'Orbitron', sans-serif; }

        .neon-border {
            border: 1px solid #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2), inset 0 0 10px rgba(0, 255, 204, 0.1);
        }

        .neon-text {
            text-shadow: 0 0 5px #00ffcc, 0 0 10px #00ffcc;
        }

        .pink-text {
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
        }

        .terminal-bg {
            background: rgba(5, 5, 10, 0.85);
            backdrop-filter: blur(5px);
        }

        .glow-btn {
            transition: all 0.3s ease;
        }

        .glow-btn:hover {
            box-shadow: 0 0 15px #ff00ff;
            background-color: rgba(255, 0, 255, 0.1);
        }

        #terminal-output::-webkit-scrollbar {
            width: 8px;
        }
        #terminal-output::-webkit-scrollbar-track {
            background: #0a0a12;
        }
        #terminal-output::-webkit-scrollbar-thumb {
            background: #00ffcc;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-6">
    <header class="mb-8 flex justify-between items-center border-b border-[#00ffcc] pb-4">
        <div>
            <h1 class="text-4xl font-bold neon-text tracking-wider">CYBER_HIVE //</h1>
            <p class="text-sm opacity-80 mt-1">Autonomous Multi-Agent Swarm Interface</p>
        </div>
        <div class="text-right">
            <div id="status-indicator" class="inline-block w-3 h-3 rounded-full bg-red-500 mr-2"></div>
            <span id="status-text" class="text-sm">DISCONNECTED</span>
        </div>
    </header>

    <main class="flex-grow grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Control Panel -->
        <section class="lg:col-span-1 neon-border terminal-bg p-6 flex flex-col rounded-sm h-fit">
            <h2 class="text-xl font-bold mb-4 border-b border-[#00ffcc]/30 pb-2 pink-text">COMMAND_MODULE</h2>
            <form id="dispatch-form" class="flex flex-col gap-4">
                <div>
                    <label class="block text-sm mb-2 opacity-80">Primary Objective:</label>
                    <textarea id="objective" rows="4"
                        class="w-full bg-black/50 border border-[#00ffcc]/50 rounded-sm p-3 text-[#00ffcc] focus:outline-none focus:border-[#ff00ff] transition-colors resize-none"
                        placeholder="e.g. Scaffold a basic Python web scraper to extract headlines from HackerNews..."></textarea>
                </div>
                <button type="submit" id="dispatch-btn"
                    class="glow-btn border border-[#ff00ff] text-[#ff00ff] font-bold py-3 px-4 rounded-sm tracking-widest uppercase mt-2">
                    INITIATE_SWARM
                </button>
            </form>

            <div class="mt-8">
                <h3 class="text-sm font-bold mb-2 opacity-80">ACTIVE_DRONES</h3>
                <ul id="drone-list" class="text-sm space-y-1 pl-2 border-l border-[#00ffcc]/30">
                    <li class="opacity-50 italic">Awaiting dispatch...</li>
                </ul>
            </div>
        </section>

        <!-- Terminal Output -->
        <section class="lg:col-span-2 neon-border terminal-bg flex flex-col rounded-sm overflow-hidden h-[600px]">
            <div class="bg-[#00ffcc]/10 p-2 border-b border-[#00ffcc]/30 flex justify-between items-center px-4">
                <h2 class="text-sm font-bold tracking-widest">TELEMETRY_STREAM</h2>
                <button id="clear-btn" class="text-xs border border-[#00ffcc]/50 px-2 py-1 hover:bg-[#00ffcc]/20 transition-colors">CLEAR</button>
            </div>
            <div id="terminal-output" class="flex-grow p-4 overflow-y-auto space-y-2 font-mono text-sm flex flex-col">
                <div class="text-[#00ffcc]/60">System initialized. Awaiting connection...</div>
            </div>
        </section>
    </main>

    <script>
    (function() {
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');
        const terminalOutput = document.getElementById('terminal-output');
        const form = document.getElementById('dispatch-form');
        const btn = document.getElementById('dispatch-btn');
        const objInput = document.getElementById('objective');
        const clearBtn = document.getElementById('clear-btn');
        const droneList = document.getElementById('drone-list');

        let ws;

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host;
            ws = new WebSocket(`${protocol}//${host}/ws`);

            ws.onopen = () => {
                statusIndicator.classList.remove('bg-red-500');
                statusIndicator.classList.add('bg-green-500', 'shadow-[0_0_10px_#22c55e]');
                statusText.innerText = 'CONNECTED';
                appendLog('SYSTEM', 'WebSocket connection established.', 'text-green-400');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };

            ws.onclose = () => {
                statusIndicator.classList.add('bg-red-500');
                statusIndicator.classList.remove('bg-green-500', 'shadow-[0_0_10px_#22c55e]');
                statusText.innerText = 'DISCONNECTED';
                setTimeout(connect, 3000);
            };
        }

        function handleMessage(data) {
            let color = 'text-[#00ffcc]';
            let prefix = '>> ';

            if (data.sender === 'QUEEN') {
                color = 'text-[#ff00ff]';
                prefix = '[QUEEN] ';
            } else if (data.sender === 'SYSTEM') {
                color = 'text-yellow-400';
                prefix = '[SYS] ';
                if(data.type === 'success') {
                    color = 'text-green-400';
                    btn.disabled = false;
                    btn.innerText = 'INITIATE_SWARM';
                }
            } else if (data.sender.startsWith('Drone')) {
                color = 'text-blue-400';
                prefix = `[${data.sender}] `;
            }

            if (data.type === 'task_list') {
                droneList.innerHTML = '';
                data.tasks.forEach((task, i) => {
                    const li = document.createElement('li');
                    li.className = 'flex items-center gap-2';
                    li.innerHTML = `<span class="text-xs text-[#00ffcc]/50">[Drone-${i+1}]</span> <span class="truncate">${task}</span>`;
                    droneList.appendChild(li);
                });
                appendLog(data.sender, `Deconstructed objective into ${data.tasks.length} tasks.`, color);
            } else if (data.type === 'result') {
                 appendLog(data.sender, data.text, color);
            } else {
                appendLog(data.sender, data.text, color);
            }
        }

        function appendLog(sender, text, colorClass) {
            const div = document.createElement('div');
            div.className = `break-words ${colorClass}`;

            const timestamp = new Date().toLocaleTimeString('en-US', { hour12: false, hour: "numeric", minute: "numeric", second: "numeric" });

            div.innerHTML = `<span class="opacity-50 text-xs">[${timestamp}]</span> <span class="font-bold">${sender}:</span> ${text}`;
            terminalOutput.appendChild(div);
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const objective = objInput.value.trim();
            if (!objective || !ws || ws.readyState !== WebSocket.OPEN) return;

            ws.send(JSON.stringify({ action: 'dispatch', objective }));

            btn.disabled = true;
            btn.innerText = 'SWARM_ACTIVE...';
            droneList.innerHTML = '<li class="opacity-50 italic">Deploying drones...</li>';
        });

        clearBtn.addEventListener('click', () => {
            terminalOutput.innerHTML = '';
            appendLog('SYSTEM', 'Telemetry stream cleared.', 'text-yellow-400');
        });

        connect();
    })();
</script>
</body>
</html>
