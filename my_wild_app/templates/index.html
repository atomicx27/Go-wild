<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Weaver</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f4f4f9; color: #333; }
        h1 { text-align: center; color: #2c3e50; }
        .chat-container { border: 1px solid #ddd; border-radius: 8px; background-color: #fff; padding: 20px; margin-bottom: 20px; height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 20px; max-width: 80%; word-wrap: break-word; }
        .user-message { background-color: #3498db; color: #fff; align-self: flex-end; }
        .bot-message { background-color: #e8eaed; color: #333; align-self: flex-start; }
        .input-area { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { padding: 10px 20px; background-color: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; transition: background-color 0.3s; }
        button:hover { background-color: #27ae60; }
        .loading { font-style: italic; color: #888; align-self: flex-start; display: none; }
    </style>
</head>
<body>
    <h1>🕸️ Web Weaver - Search & Chat AI</h1>
    <div class="chat-container" id="chatContainer">
        <div class="message bot-message">Hello! I'm Web Weaver. Ask me anything, and I'll search the web to give you an up-to-date answer!</div>
    </div>
    <div class="loading" id="loadingIndicator">Weaving the web...</div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask a question..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            input.value = '';

            const loading = document.getElementById('loadingIndicator');
            loading.style.display = 'block';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                addMessage(data.response, 'bot');
            } catch (error) {
                addMessage("Error: Could not reach the server.", 'bot');
            } finally {
                loading.style.display = 'none';
            }
        }

        function addMessage(text, sender) {
            const container = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}-message`;
            msgDiv.textContent = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
