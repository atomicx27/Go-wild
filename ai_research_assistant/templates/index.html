<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous AI Research Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .cyber-bg {
            background-color: #0f172a;
            color: #e2e8f0;
        }
        .agent-log {
            font-family: 'Fira Code', monospace;
            background-color: #1e293b;
            border-left: 4px solid #3b82f6;
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            color: #60a5fa;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        .markdown-body h1 { font-size: 2rem; }
        .markdown-body h2 { font-size: 1.5rem; }
        .markdown-body h3 { font-size: 1.25rem; }
        .markdown-body p { margin-bottom: 1rem; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-body strong { color: #f8fafc; }
    </style>
</head>
<body class="cyber-bg h-screen flex flex-col font-sans">

    <header class="p-6 bg-slate-900 shadow-md border-b border-slate-700 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold text-blue-400">Autonomous Researcher</h1>
            <p class="text-sm text-slate-400 mt-1">Powered by Qwen2.5 & FastAPI SSE</p>
        </div>
        <div class="flex items-center gap-4">
            <input type="text" id="topicInput" placeholder="Enter research topic..."
                   class="bg-slate-800 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500 w-64"
                   onkeypress="if(event.key === 'Enter') startResearch()">
            <button onclick="startResearch()" id="startBtn"
                    class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-lg font-semibold transition-colors duration-200">
                Start Research
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-hidden flex flex-col md:flex-row">
        <!-- Agent Logs / Thoughts Panel -->
        <section class="w-full md:w-1/3 p-4 flex flex-col border-r border-slate-700">
            <h2 class="text-xl font-semibold mb-4 text-slate-300 flex items-center gap-2">
                <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                Agent Thoughts
            </h2>
            <div id="statusIndicator" class="text-sm text-blue-400 mb-2 font-mono h-6 animate-pulse"></div>
            <div id="logsContainer" class="flex-1 overflow-y-auto agent-log p-4 rounded-lg text-sm space-y-2 shadow-inner">
                <div class="text-slate-500 italic">Waiting for instructions...</div>
            </div>
        </section>

        <!-- Final Report Panel -->
        <section class="w-full md:w-2/3 p-4 flex flex-col bg-slate-900">
            <h2 class="text-xl font-semibold mb-4 text-slate-300 flex items-center gap-2">
                <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Research Report
            </h2>
            <div id="reportContainer" class="flex-1 overflow-y-auto bg-slate-800 p-6 rounded-lg shadow-lg markdown-body border border-slate-700">
                <div class="text-slate-500 italic flex items-center justify-center h-full">Report will be generated here...</div>
            </div>
        </section>
    </main>

    <script>
        let eventSource = null;
        let currentReportMarkdown = "";

        function addLog(message, type = 'info') {
            const logsContainer = document.getElementById('logsContainer');
            if (logsContainer.children.length > 0 && logsContainer.children[0].classList.contains('italic')) {
                logsContainer.innerHTML = '';
            }
            const logEntry = document.createElement('div');

            if (type === 'error') logEntry.className = "text-red-400";
            else if (type === 'success') logEntry.className = "text-emerald-400";
            else logEntry.className = "text-slate-300";

            const timestamp = new Date().toLocaleTimeString([], {hour12: false});
            logEntry.innerHTML = `<span class="text-slate-500">[${timestamp}]</span> ${message}`;

            logsContainer.appendChild(logEntry);
            logsContainer.scrollTop = logsContainer.scrollHeight;
        }

        function startResearch() {
            const topic = document.getElementById('topicInput').value.trim();
            if (!topic) return;

            const btn = document.getElementById('startBtn');
            const statusIndicator = document.getElementById('statusIndicator');
            const reportContainer = document.getElementById('reportContainer');

            // Reset UI
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            document.getElementById('logsContainer').innerHTML = '';
            reportContainer.innerHTML = '';
            currentReportMarkdown = "";

            if (eventSource) {
                eventSource.close();
            }

            // Start SSE connection
            const url = `/api/research?topic=${encodeURIComponent(topic)}`;
            eventSource = new EventSource(url);

            eventSource.onmessage = function(event) {
                try {
                    const parsedData = JSON.parse(event.data);
                    const action = parsedData.action;
                    const data = parsedData.data;

                    if (action === "status") {
                        statusIndicator.textContent = `> ${data}`;
                        addLog(data, 'info');
                    } else if (action === "log") {
                        addLog(`  -> ${data}`, 'info');
                    } else if (action === "report_start") {
                        addLog("Began streaming report...", 'success');
                        statusIndicator.textContent = "> Writing report...";
                    } else if (action === "report_chunk") {
                        currentReportMarkdown += data;
                        reportContainer.innerHTML = marked.parse(currentReportMarkdown);
                        reportContainer.scrollTop = reportContainer.scrollHeight;
                    } else if (action === "error") {
                        addLog(`Error: ${data}`, 'error');
                        statusIndicator.textContent = "> Encountered an error.";
                        eventSource.close();
                        resetButton();
                    } else if (action === "done") {
                        addLog("Research flow complete.", 'success');
                        statusIndicator.textContent = "> Done.";
                        eventSource.close();
                        resetButton();
                    }
                } catch (e) {
                    console.error("Error parsing SSE data", e);
                }
            };

            eventSource.onerror = function(err) {
                console.error("SSE Error:", err);
                addLog("Connection lost or error occurred.", 'error');
                statusIndicator.textContent = "> Error.";
                eventSource.close();
                resetButton();
            };

            function resetButton() {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
